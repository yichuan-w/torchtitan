<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Accuracy</title>
<style>
body{font:16px system-ui,sans-serif;margin:24px;color:#182235;background:white}p{max-width:850px;color:#526071;line-height:1.5}input{padding:8px;width:300px}button{padding:8px}svg{width:100%;max-width:900px;height:300px}#change{font-size:28px;font-weight:650;margin:18px 0 4px}small{color:#64748b}table{border-collapse:collapse;width:100%;max-width:900px}td{padding:8px;border-bottom:1px solid #ddd}
</style>
<h2>Accuracy on unchanged tasks</h2>
<p id="explanation"></p>
<label>View <input id="task" list="tasks" placeholder="All unchanged tasks"><datalist id="tasks"></datalist></label>
<button id="show">Show</button> <button id="all">All unchanged tasks</button>
<div id="change"></div><p id="count"></p>
<svg id="chart" viewBox="0 0 900 300" role="img" aria-label="Accuracy change"></svg>
<table id="detail"></table>
<p id="note"></p><small id="updated"></small>
<script>
const rows=__ROWS__, summary=__SUMMARY__;
const input=document.getElementById('task');
for(const id of [...new Set(rows.map(r=>r.task))].sort()){const o=document.createElement('option');o.value=id;document.getElementById('tasks').appendChild(o)}
const pct=v=>(100*v).toFixed(1)+'%';
function draw(){
 const overview=!input.value;
 const chosen=overview?[]:rows.filter(r=>r.task===input.value).sort((a,b)=>a.group-b.group);
 const points=overview?[{label:'First observation',...summary.baseline},{label:'Latest observation',...summary.current}]:chosen.map(r=>({...r,label:`Policy ${r.policy_at_claim} · r${r.rev}`}));
 const scored=points.filter(r=>r.accuracy!==null);
 const delta=scored.length>1?(scored.at(-1).accuracy-scored[0].accuracy)*100:null;
 document.querySelector('h2').textContent=overview?'Accuracy on unchanged tasks':input.value;
 document.getElementById('explanation').textContent=overview?'To see whether the model improved, compare its first and latest results on the same unchanged tasks.':'Follow this task through training. r0 is the original task; r1, r2, … are rewritten versions.';
 document.getElementById('change').textContent=delta===null?'Waiting for repeated observations':`${delta>=0?'+':''}${delta.toFixed(1)} percentage points`;
 document.getElementById('count').textContent=overview?`${summary.baseline.tasks} identical tasks in both observations. Accuracy = successful attempts / scored attempts.`:`${chosen.length} observations. Each point shows successful attempts / scored attempts.`;
 document.getElementById('note').textContent=overview?'Tasks enter or leave this comparison as observations arrive or tasks are rewritten. Compare the two points in this snapshot. These are training tasks; use fixed TB evaluation to judge generalization. Infrastructure failures and missing scores are excluded.':'A change between different task versions also reflects a changed problem. The policy label gives the model version at group start; asynchronous rollouts can span later model updates. Infrastructure failures and missing scores are excluded.';
 document.getElementById('updated').textContent=`Updated ${summary.updated} · refreshes every five minutes`;
 const svg=document.getElementById('chart');svg.replaceChildren();
 const add=(tag,attrs,text)=>{const el=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(attrs))el.setAttribute(k,v);if(text!==undefined)el.textContent=text;svg.appendChild(el);return el};
 const x=i=>110+i/Math.max(points.length-1,1)*640,y=v=>225-v*180;
 for(const v of [0,.25,.5,.75,1]){add('line',{x1:60,x2:820,y1:y(v),y2:y(v),stroke:'#e2e8f0'});add('text',{x:10,y:y(v)+4,fill:'#64748b'},pct(v))}
 add('polyline',{points:points.map((r,i)=>r.accuracy===null?null:`${x(i)},${y(r.accuracy)}`).filter(Boolean).join(' '),fill:'none',stroke:'#2563eb','stroke-width':3});
 points.forEach((r,i)=>{if(r.accuracy===null)return;const c=add('circle',{cx:x(i),cy:y(r.accuracy),r:6,fill:'#2563eb'});const t=document.createElementNS('http://www.w3.org/2000/svg','title');t.textContent=`${r.label}: ${r.solved}/${r.scored}`;c.appendChild(t);add('text',{x:x(i),y:y(r.accuracy)-15,'text-anchor':'middle',fill:'#182235'},pct(r.accuracy));add('text',{x:x(i),y:255,'text-anchor':'middle',fill:'#64748b'},r.label)});
 const table=document.getElementById('detail');table.replaceChildren();
 for(const r of points){const tr=document.createElement('tr');for(const value of [r.label,`${r.solved} / ${r.scored}`,r.accuracy===null?'No scored attempts':pct(r.accuracy)]){const td=document.createElement('td');td.textContent=value;tr.appendChild(td)}table.appendChild(tr)}
}
input.addEventListener('change',draw);document.getElementById('show').addEventListener('click',draw);document.getElementById('all').addEventListener('click',()=>{input.value='';draw()});draw();
</script></html>
