[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; Application stack with 4 services

[program:redis]
command=/usr/bin/redis-server /opt/myapp/config/redis.conf
directory=/opt/myapp
user=myapp
autostart=true
autorestart=true
stdout_logfile=/var/log/myapp/redis.log
stderr_logfile=/var/log/myapp/redis_error.log

[program:worker]
command=/opt/myapp/bin/worker
directory=/opt/myapp
user=myapp
environment=REDIS_URL="redis://localhost:6379"
autostart=true
autorestart=true
stdout_logfile=/var/log/myapp/worker.log
stderr_logfile=/var/log/myapp/worker_error.log

[program:api]
command=/opt/myapp/bin/api-server
directory=/opt/myapp
user=myapp
environment=REDIS_URL="redis://localhost:6379",PORT="8000"
autostart=true
autorestart=true
stdout_logfile=/var/log/myapp/api.log
stderr_logfile=/var/log/myapp/api_error.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;" -c /opt/myapp/config/nginx.conf
directory=/opt/myapp
user=myapp
autostart=true
autorestart=true
stdout_logfile=/var/log/myapp/nginx.log
stderr_logfile=/var/log/myapp/nginx_error.log
