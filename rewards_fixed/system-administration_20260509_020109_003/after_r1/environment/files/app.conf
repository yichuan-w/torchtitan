/var/log/myapp/app.log {
    size 10M
    rotate 7
    dateext
    dateformat -%Y%m%d
    copytruncate
    compress
    delaycompress
    missingok
    notifempty
}

# access.log rotation - misconfigured
/var/log/myapp/access.log {
    monthly
    rotate 7
    copytruncate
    compress
    delaycompress
    missingok
    notifempty
}

# error.log rotation - misconfigured
/var/log/myapp/error.log {
    daily
    rotate 30
    copytruncate
    compress
    delaycompress
    missingok
    notifempty
}
