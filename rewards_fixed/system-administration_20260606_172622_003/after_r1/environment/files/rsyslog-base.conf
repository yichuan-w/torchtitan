# Minimal rsyslog configuration - local logging only
# The solver must add TLS server + client configuration

module(load="imuxsock")     # local system logging support
module(load="imklog")       # kernel logging support

# Use traditional log format
$ActionFileDefaultTemplate RSYSLOG_TraditionalFileFormat

# Default rules for local logging
auth,authpriv.*                 /var/log/auth.log
*.*;auth,authpriv.none          -/var/log/syslog
kern.*                          -/var/log/kern.log
mail.*                          -/var/log/mail.log
daemon.*                        -/var/log/daemon.log
user.*                          -/var/log/user.log
*.emerg                         :omusrmsg:*

# Include additional config files
$IncludeConfig /etc/rsyslog.d/*.conf
