; Backend service configurations

[program:backend1]
command=python3 /app/backend_service.py 8001
directory=/app
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=10
stdout_logfile=/var/log/app/backend1.log
stderr_logfile=/var/log/app/backend1_error.log
environment=SERVICE_NAME="backend1",BACKEND_PORT="8001"
stdout_logfile_maxbytes=10
stdout_logfile_backups=0

[program:backend2]
command=python3 /app/backend_service.py 8002
directory=/app
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=10
stdout_logfile=/var/log/app2/backend2.log
stderr_logfile=/var/log/app2/backend2_error.log
environment=SERVICE_NAME="backend2",BACKEND_PORT="8002"

[program:backend3]
command=python3 /app/backend_service.py 8003
directory=/app
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=10
stdout_logfile=/var/log/app/backend3.log
stderr_logfile=/var/log/app/backend3_error.log
environment=SERVICE_NAME="backend3",BACKEND_PORT="8003"

; Event listener for process state changes - has configuration issues
[eventlistener:process_state]
command=python3 /app/event_listener.py
events=PROCESS_STATE_FATAL,PROCESS_STATE_EXITED,PROCESS_STATE_STOPPED
buffer_size=100
stdout_logfile=/var/log/supervisor/events.log
stderr_logfile=/var/log/supervisor/events_error.log
; Bug: Event listener disabled
autostart=false

