; Application server configuration
[program:appserver]
command=/opt/appenv/bin/gunicorn --bind 127.0.0.1:5000 --workers 2 app:app
directory=/opt/webapp
user=root
autostart=true
autorestart=true
priority=50
stdout_logfile=/var/log/supervisor/appserver.log
stderr_logfile=/var/log/supervisor/appserver_err.log
environment=PATH="/opt/appenv/bin:/usr/bin:/bin",DB_HOST="localhost",DB_PORT="5432",DB_NAME="appdb",DB_USER="appuser",DB_PASSWORD="apppass123",REDIS_HOST="localhost",REDIS_PORT="6379"

