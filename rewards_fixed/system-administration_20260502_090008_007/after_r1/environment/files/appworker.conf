; Background worker configuration
[program:appworker]
command=/opt/appenv/bin/python /opt/webapp/worker.py
directory=/opt/webapp
user=root
autostart=true
autorestart=true
priority=50
stdout_logfile=/var/log/supervisor/appworker.log
stderr_logfile=/var/log/supervisor/appworker_err.log
environment=PATH="/opt/appenv/bin:/usr/bin:/bin",DB_HOST="localhost",DB_PORT="5432",DB_NAME="appdb",DB_USER="appuser",DB_PASSWORD="apppass123",REDIS_HOST="localhost",REDIS_PORT="6379"
