; PostgreSQL database configuration
[program:appdb]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/16/main -c config_file=/etc/postgresql/16/main/postgresql.conf
user=postgres
autostart=true
autorestart=true
priority=100
stdout_logfile=/var/log/supervisor/appdb.log
stderr_logfile=/var/log/supervisor/appdb_err.log
stopasgroup=true
killasgroup=true



