# Simulation Configuration
# This file contains additional settings for the simulation

[solver]
# Time step settings
initial_step = 1e-6
max_step = 100.0
min_step = 1e-12

# Tolerance settings
rtol = 1e-3
atol = 1e-6

# Output settings
dense_output = true
save_steps = true

[network]
# These settings are for future network-based solver options
enabled = false
host = localhost
port = 8080

[logging]
level = INFO
file = simulation.log
