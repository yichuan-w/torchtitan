[build-system]
requires = ["setuptools==80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datatools"
version = "0.2.0"
description = "CLI utilities for data processing"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "DevTeam", email = "dev@example.com"}
]
keywords = ["cli", "data", "csv", "json"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/example/datatools"
Documentation = "https://datatools.readthedocs.io"
Repository = "https://github.com/example/datatools"

[tool.setuptools]
packages = ["datatools"]

[tool.setuptools.package-dir]
"" = "src"
